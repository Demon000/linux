%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/maxim,max96717.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX96717/MAX9295A/MAX96793 GMSL Serializers

maintainers:
  - Cosmin Tanislav <cosmin.tanislav@analog.com>

description: |
  The MAX96717 and MAX9295A are serializers that receive video on an
  MIPI CSI-2 interface and outputs it on a GMSL2 link.
  The MAX96793 is a GMSL3-compatible variant of the MAX96717.

unevaluatedProperties: false

properties:
  compatible:
    items:
      - enum:
          - maxim,max9295a
          - maxim,max96717
          - maxim,max96793

  gpio-controller: true

  '#gpio-cells':
    const: 2

  i2c-alias-pool:
    maxItems: 2

  i2c-atr:
    patternProperties:
      '^i2c@0':
        $ref: /schemas/i2c/i2c-controller.yaml#
        properties:
          reg:
            items:
              max: 0

  i2c-gate:
    $ref: /schemas/i2c/i2c-gate.yaml
    unevaluatedProperties: false

required:
  - compatible
  - gpio-controller
  - '#gpio-cells'

additionalProperties:
  anyOf:
    - type: object
      allOf:
        - $ref: /schemas/media/i2c/maxim,max96717-pinctrl.yaml#

      unevaluatedProperties: false

    - type: object
      additionalProperties:
        type: object
        allOf:
          - $ref: /schemas/media/i2c/maxim,max96717-pinctrl.yaml#

        unevaluatedProperties: false

allOf:
  - $ref: /schemas/i2c/i2c-atr.yaml#
  - oneOf:
    - required:
        - i2c-atr
        - i2c-alias-pool
    - required:
        - i2c-gate
