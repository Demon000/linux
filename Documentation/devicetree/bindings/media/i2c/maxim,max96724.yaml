%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/maxim,max96724.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX96712/MAX96724 GMSL2 Deserializers

maintainers:
  - Cosmin Tanislav <cosmin.tanislav@analog.com>

description: |
  The MAX96712/MAX96724 are deserializers that receive four GMSL2 links
  and output video data to 1, 2, or 4 MIPI D-PHY or C-PHY outputs.

unevaluatedProperties: false

properties:
  compatible:
    items:
      - enum:
          - maxim,max96712
          - maxim,max96724

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  reg:
    maxItems: 1

  i2c-mux:
    $ref: /schemas/i2c/i2c-mux.yaml#
    patternProperties:
      '^i2c@[0-3]$':
        $ref: /schemas/i2c/i2c-controller.yaml#
        properties:
          reg:
            items:
              min: 0
              max: 3

required:
  - '#address-cells':
  - '#size-cells'
  - compatible
  - reg
