%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/maxim,max9296a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX9296A/MAX96714/F/R/MAX96716/MAX96792A GMSL Deserializers

maintainers:
  - Cosmin Tanislav <cosmin.tanislav@analog.com>

description: |
  The MAX9296A is a deserializer that receives two GMSL2 links and outputs
  video data to 1 or 2 MIPI D-PHY outputs.
  The MAX96714 is a variant of the MAX9296A that only receives one link.
  The MAX96716A is a variant of the MAX96714 that receives two links.
  The MAX96792A is a GMSL3-compatible variant of the MAX96714.

unevaluatedProperties: false

properties:
  compatible:
    oneOf:
      - const: maxim,max9296a
      - const: maxim,max96714
      - const: maxim,max96714f
      - const: maxim,max96714r
      - const: maxim,max96716a
      - const: maxim,max96792a

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  reg:
    maxItems: 1

  powerdown-gpios:
    maxItems: 1
    description:
      Specifier for the GPIO connected to the PWDNB pin.

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - maxim,max96714
              - maxim,max96714f
              - maxim,max96714r
    then:
      properties:
        i2c-gate:
          $ref: /schemas/i2c/i2c-gate.yaml
          unevaluatedProperties: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - maxim,max9296a
              - maxim,max96792a
    then:
      properties:
        i2c-alias-pool:
          maxItems: 2

        i2c-atr:
          patternProperties:
            '^i2c@[0-1]$':
              $ref: /schemas/i2c/i2c-controller.yaml#
              properties:
                reg:
                  items:
                    min: 0
                    max: 1

  - if:
      properties:
        compatible:
          contains:
            const: maxim,max96716a
    then:
      properties:
        unevaluatedProperties: false
        i2c-mux:
          $ref: /schemas/i2c/i2c-mux.yaml#
          patternProperties:
            '^i2c@[0-1]$':
              $ref: /schemas/i2c/i2c-controller.yaml#
              properties:
                reg:
                  items:
                    min: 0
                    max: 1

required:
  - '#address-cells':
  - '#size-cells'
  - compatible
  - reg

allOf:
  - $ref: /schemas/i2c/i2c-atr.yaml#
  - oneOf:
    - required:
        - i2c-atr
        - i2c-alias-pool
    - required:
        - i2c-mux
    - required:
        - i2c-gate
