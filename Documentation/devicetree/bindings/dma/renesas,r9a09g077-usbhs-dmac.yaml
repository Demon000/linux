%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/renesas,r9a09g077-usbhs-dmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/T2H USB DMA Controller

description:
  The USB DMA Controller is embedded in the USB 2.0 High-Speed Function
  Module (USBf) and performs data transfers between memory and the USB
  FIFOs. It has two channels, each fixed to a specific USB FIFO.

maintainers:
  - Cosmin Tanislav <cosmin-gabriel.tanislav.xa@renesas.com>

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: renesas,r9a09g077-usbhs-dmac # RZ/T2H

      - items:
          - const: renesas,r9a09g087-usbhs-dmac # RZ/N2H
          - const: renesas,r9a09g077-usbhs-dmac # RZ/T2H

  reg:
    maxItems: 1

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: ch0
      - const: ch1

  clocks:
    maxItems: 1

  '#dma-cells':
    const: 1
    description:
      The cell specifies the channel number of the DMAC port connected to
      the DMA client.

  dma-channels:
    const: 2

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - '#dma-cells'
  - dma-channels
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/renesas,r9a09g077-cpg-mssr.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dma-controller@92041400 {
        compatible = "renesas,r9a09g077-usbhs-dmac";
        reg = <0x92041400 0x330>;
        interrupts = <GIC_SPI 588 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 589 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "ch0", "ch1";
        clocks = <&cpg CPG_MOD 408>;
        power-domains = <&cpg>;
        #dma-cells = <1>;
        dma-channels = <2>;
    };
